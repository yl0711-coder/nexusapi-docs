name: Docs quality

on:
  pull_request:
    paths:
      - "**/*.mdx"
      - "openapi/**/*.json"
      - "docs.json"
      - "scripts/check-docs.mjs"
      - "scripts/check-openapi.mjs"
      - ".github/workflows/docs-quality.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.mdx"
      - "openapi/**/*.json"
      - "docs.json"
      - "scripts/check-docs.mjs"
      - "scripts/check-openapi.mjs"
      - ".github/workflows/docs-quality.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate routes, locales, frontmatter, and internal links
        run: node scripts/check-docs.mjs

      - name: Validate public OpenAPI definition
        run: node scripts/check-openapi.mjs

      - name: Run Mintlify broken-link check
        run: npx --yes mint@latest broken-links
